# Ordinary historical demo links have no old contract assets.
# Only generated demo IDs/query formats are allowed; mode=live remains paused.
if ($request_uri ~ "^/bemine/preview\.html(\?(source=(tg|x|native)|lang=(zh|en)|source=(tg|x|native)&lang=(zh|en)|lang=(zh|en)&source=(tg|x|native)))?$") { return 308 https://bemine.cc.cd/preview.html$is_args$args; }
if ($request_uri ~ "^/bemine/share/(anime|finance|future|ink|original|papercraft|real|space|tech)\.html\?mode=demo&project=(16210|8204|15832|16928|8316|17006)(&source=(tg|x|native))?$") { return 308 https://bemine.cc.cd/share/$1.html$is_args$args; }
# User authorized temporary pause of all old/test BEMine routes on 2026-10-02.
# v5 routes and the TapeOut application are intentionally outside this match.
# 418 is internal only; the maintenance page returns HTTP 503 without caching.
error_page 418 =503 /bemine-paused.html;
if ($uri ~ "^/(bemine(-v[1-4]|-full-test|-sale-test|-test|-live-test|-preview)?|pinkuang-(deploy(-v[1-4])?|upgrade(-v[1-4])?))(/|$)") {
    return 418;
}
location = /bemine-paused.html {
    internal;
    root /var/www/bemine-maintenance;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "86400" always;
}
