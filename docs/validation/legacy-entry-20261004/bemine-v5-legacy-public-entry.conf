# Public-document compatibility only for the tapeout.cc.cd HTTPS server.
# Exact current v5 documents redirect to the canonical BEMine product origin.
# APIs remain inaccessible here; unknown paths continue to the normal 404 handler.
location = /bemine-v5/api { return 404; }
location ^~ /bemine-v5/api/ { return 404; }
