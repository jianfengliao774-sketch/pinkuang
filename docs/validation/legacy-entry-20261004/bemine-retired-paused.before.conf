# User authorized temporary pause of all old/test BEMine routes on 2026-10-02.
# v5 routes and the TapeOut application are intentionally outside this match.
# 418 is internal only; the maintenance page returns HTTP 503 without caching.
error_page 418 =503 /bemine-paused.html;
if ($uri ~ "^/(bemine(-v[1-4]|-full-test|-sale-test|-test|-live-test|-preview)?|pinkuang-(deploy(-v[1-4])?|upgrade(-v[1-4])?))(/|$)") {
    return 418;
}
location = /bemine-paused.html {
    internal;
    root /var/www/bemine-maintenance;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "86400" always;
}
