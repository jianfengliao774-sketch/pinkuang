name: Contracts

on:
  push:
    # PRs validate their merge ref; avoid a duplicate feature-branch RPC run.
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_fork:
        description: Run protocol, purchase, rewards, shares, controlled sale and burn forks on the reviewed fixed block
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A manual contracts-only run must not cancel a required push/PR fork check.
  group: contracts-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci
      VALIDATION_TASK: T1e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install slither-analyzer==0.11.5
      - name: Format, sizes, unit and invariants, T1a through complete T1e layout compatibility, Slither
        id: validation
        env:
          # This directory is outside the checkout and unique to the current run.
          # Checked-in local logs cannot be uploaded as remote-run evidence.
          VALIDATION_EVIDENCE_ROOT: ${{ runner.temp }}/t1e-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/check-local.mjs
      - name: Preserve current contracts validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1e-contracts-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t1e-contracts-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

  fork:
    if: github.event_name != 'workflow_dispatch' || inputs.run_fork
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize the public RPC across refs. Unlike the default single pending
    # slot, queue:max retains waiting checks (up to GitHub's 100-job limit).
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency
    concurrency:
      group: contracts-bsc-public-rpc
      queue: max
      cancel-in-progress: false
    env:
      FOUNDRY_PROFILE: ci
      VALIDATION_TASK: T1e
      # Public archive endpoint: no credentials are exposed to pull request code.
      BSC_RPC_URL: https://bsc-mainnet.public.blastapi.io
      FORK_BLOCK: '123728000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - name: Protocol, purchase, rewards, shares, controlled sale and burn forks
        env:
          VALIDATION_EVIDENCE_ROOT: ${{ runner.temp }}/t1e-fork-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:fork
      - name: Preserve current raw fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1e-fork-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t1e-fork-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
