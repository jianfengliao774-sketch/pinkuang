name: Contracts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_fork:
        description: Run protocol and T1b purchase forks on the reviewed fixed block
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci
      VALIDATION_TASK: T1b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install slither-analyzer==0.11.5
      - name: Format, sizes, unit and invariant tests, T1a layout compatibility, Slither
        id: validation
        env:
          # This directory is outside the checkout and unique to the current run.
          # Checked-in local logs cannot be uploaded as remote-run evidence.
          VALIDATION_EVIDENCE_ROOT: ${{ runner.temp }}/t1b-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/check-local.mjs
      - name: Preserve current contracts validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1b-contracts-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t1b-contracts-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

  fork:
    if: github.event_name != 'workflow_dispatch' || inputs.run_fork
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
      VALIDATION_TASK: T1b
      # Public archive endpoint: no credentials are exposed to pull request code.
      BSC_RPC_URL: https://bsc-mainnet.public.blastapi.io
      FORK_BLOCK: '123728000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - name: Protocol and purchase fork tests
        env:
          VALIDATION_EVIDENCE_ROOT: ${{ runner.temp }}/t1b-fork-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:fork
      - name: Preserve current raw fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1b-fork-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t1b-fork-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
