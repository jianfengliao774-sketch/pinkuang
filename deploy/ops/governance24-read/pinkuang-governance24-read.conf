# Include inside the existing HTTPS server. Exact match wins over the prefix deny.
location = /pinkuang-governance24-read/api/rpc {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:4230/api/rpc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 16s;
    proxy_send_timeout 16s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /pinkuang-governance24-read/ {
    return 404;
}
