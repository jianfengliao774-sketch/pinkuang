# Include only inside the existing tapeout.cc.cd HTTPS server block.
# This independent static site never routes journal or deployment-signing APIs.
location = /pinkuang-upgrade-v2 { return 308 /pinkuang-upgrade-v2/; }

location = /pinkuang-upgrade-v2/api/rpc {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:4174/api/rpc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}

location ^~ /pinkuang-upgrade-v2/ {
    alias /var/www/pinkuang-upgrade-v2/current/;
    index index.html;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
