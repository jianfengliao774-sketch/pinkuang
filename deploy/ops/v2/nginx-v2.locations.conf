# Insert/include ONLY inside the existing tapeout.cc.cd HTTPS server block after review.
# Do not replace /pinkuang-deploy/, /bemine/, SparkDraw routes or server-wide CSP.
location = /pinkuang-deploy-v2 { return 308 /pinkuang-deploy-v2/; }
location ^~ /pinkuang-deploy-v2/ {
    proxy_pass http://127.0.0.1:4174/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Connection "";
    proxy_cookie_path /api/journal /pinkuang-deploy-v2/api/journal;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # The upstream sets Cache-Control; keep inherited server-wide security headers intact.
}
