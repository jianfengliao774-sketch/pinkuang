# Include inside the existing bemine.cc.cd HTTPS server block.
# Only the read-only RPC is proxied; journal and signing APIs remain unavailable.
location = /pinkuang-upgrade-v5 { return 308 /pinkuang-upgrade-v5/; }

location = /pinkuang-upgrade-v5/api/rpc {
    limit_except POST { deny all; }
    limit_req zone=pinkuang_v4_api_ip burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:4227/api/rpc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /pinkuang-upgrade-v5/ {
    alias /srv/pinkuang-upgrade-v5/current/;
    autoindex off;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
