location = /pinkuang-deploy-v5 { return 308 /pinkuang-deploy-v5/; }
location ^~ /pinkuang-deploy-v5/api/ {
    proxy_set_header Authorization "";
    limit_req zone=pinkuang_v4_api_ip burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4217/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Connection "";
    proxy_cookie_path /api/journal /pinkuang-deploy-v5/api/journal;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location ^~ /pinkuang-deploy-v5/ {
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:4217/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Connection "";
    proxy_cookie_path /api/journal /pinkuang-deploy-v5/api/journal;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
