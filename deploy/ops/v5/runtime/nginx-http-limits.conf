# Install in /etc/nginx/conf.d/bemine-v5-read-limits.conf (http context).
# Use the peer address, never caller-supplied X-Forwarded-For. Display URLs
# bypass the API proxy, so they need their own per-client request/stream cap.
limit_req_zone $binary_remote_addr zone=bemine_v5_display_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bemine_v5_sse_ip:10m;
limit_conn_zone $server_name zone=bemine_v5_sse_all:1m;
