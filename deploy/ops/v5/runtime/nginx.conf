# Included inside the bemine.cc.cd HTTPS server. The retired-site guard stays enabled.
# Only HTML entry points redirect. API, data and immutable assets retain their namespace.
location = /bemine-v5 {
    add_header Cache-Control "no-store" always;
    return 308 /$is_args$args;
}
location ^~ /bemine-v5/api/journal/deployment { return 404; }
location ^~ /bemine-v5/api/journal/fresh-activation { return 404; }
location ^~ /bemine-v5/api/journal/upgrade { return 404; }
location = /bemine-v5/api/chain-index/v1/display/events {
    limit_req zone=bemine_v5_display_ip burst=40 nodelay;
    limit_req_status 429;
    limit_conn bemine_v5_sse_ip 16;
    limit_conn bemine_v5_sse_all 64;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4224/v1/display/events;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}
location ^~ /bemine-v5/api/chain-index/v1/display/ {
    limit_req zone=bemine_v5_display_ip burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4224/v1/display/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location ^~ /bemine-v5/api/ {
    proxy_pass http://127.0.0.1:4227/api/;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_cookie_path /api/journal /bemine-v5/api/journal;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
}
location ^~ /bemine-v5/firsto-api/ {
    proxy_pass http://127.0.0.1:4227/firsto-api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location = /bemine-v5/data/bem-price.json {
    alias /var/lib/pinkuang-v5-public/price/bem-price.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
location ^~ /bemine-v5/_next/static/ {
    rewrite ^/bemine-v5/(.*)$ /$1 break;
    root /var/www/bemine-v5/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /bemine-v5/ {
    add_header Cache-Control "no-store" always;
    return 308 /$is_args$args;
}
location = /bemine-v5/index.html {
    add_header Cache-Control "no-store" always;
    return 308 /$is_args$args;
}
location ^~ /bemine-v5/ {
    rewrite ^/bemine-v5/(.*)$ /$1 break;
    root /var/www/bemine-v5/current;
    index index.html;
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
}

