[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules"]
auto_detect_remappings = false
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "out" }]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 120

[profile.ci.fuzz]
runs = 256

[profile.ci.invariant]
runs = 128
depth = 64
fail_on_revert = true
