# Compatibility route for an already open, nested deployment console.
# The canonical full-test journal/cookie remains under /bemine-full-test/api/.
location = /bemine-full-test/deploy/api/rpc {
    proxy_pass http://127.0.0.1:4207/api/rpc;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    client_max_body_size 512k;
}
